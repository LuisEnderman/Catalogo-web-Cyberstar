<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Star | Catálogo</title>

    <link rel="canonical" href="https://cyberstar.site/" />
    <link rel="icon" type="image/svg+xml" href="logo-cyberstar.svg?v=2" id="favicon" />

    <meta name="description" content="Cyber Star - Marca de ropa streetwear y estética Y2K en Venezuela. Encuentra franelas oversize, accesorios y prendas personalizadas con diseños exclusivos.">
    <meta name="keywords" content="cyber star, streetwear venezuela, ropa y2k, franelas oversize, barquisimeto ropa, streetwear barquisimeto, catalogo cyberstar">
    <meta name="author" content="Cyber Star">
    <meta name="robots" content="index, follow">

    <link rel="icon" type="image/png" href="logo.png">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cyberstar.site/">
    <meta property="og:title" content="Cyber Star | Streetwear & Y2K Catálogo">
    <meta property="og:description" content="Explora nuestro stock de franelas oversize y accesorios urbanos. Arma tu pedido personalizado con envío a toda Venezuela.">
    <meta property="og:image" content="https://cyberstar.site/Recursos/logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- ENCABEZADO / NAVBAR -->
    <header>
        <div class="logo">
            <a href="index.html" style="display: block; text-decoration: none;">
                <img src="Recursos/logo.png" alt="Cyber Star Logo">
            </a>
        </div>
        <nav>
            <a href="#catalogo">Catálogo</a>
            <a href="#contacto">Contacto</a>
            <button id="btn-abrir-carrito" onclick="toggleCarrito()" style="background:none; border:none; cursor:pointer; font-size:1.2rem; color:var(--color-texto); position:relative; margin-left:20px;">
                <i class="fas fa-shopping-cart"></i>
                <span id="contador-carrito" style="position:absolute; top:-8px; right:-10px; background:#a855f7; color:white; border-radius:50%; padding:2px 6px; font-size:0.7rem; font-weight:bold;">0</span>
            </button>
        </nav>
    </header>

    <!-- FILTROS POR CATEGORÍA FÍSICA -->
    <div class="filtros">
        <button class="btn-filtro activo" data-categoria="todos">Todos</button>
        <button class="btn-filtro" data-categoria="streetwear">Streetwear</button>
        <button class="btn-filtro" data-categoria="accesorios">Accesorios</button>
    </div>

    <div class="contenedor-trigger-filtros">
        <button id="btn-toggle-filtros">
            <i class="fas fa-sliders-h" style="font-size: 0.7rem;"></i> Filtrar
        </button>
    </div>

    <div id="panel-micro-filtros" class="micro-filtros-colapsable">
        <div style="display: flex; justify-content: flex-start; gap: 8px; flex-wrap: wrap; padding: 15px 0;">
            <button class="btn-micro-filtro activo-micro" data-estilo="todos">Todo</button>
            <button class="btn-micro-filtro" data-estilo="y2k">Y2K Retro</button>
            <button class="btn-micro-filtro" data-estilo="cyber-grunge">Cyber-Grunge</button>
            <button class="btn-micro-filtro" data-estilo="personalizado">Custom / Personalizables</button>
        </div>
    </div>

    <!-- GRILLA DE PRODUCTOS -->
    <main id="catalogo" class="contenedor-productos">
        <!-- Las tarjetas aparecerán aquí automáticamente vía js/app.js -->
    </main>

    <!-- SECCIÓN DE CONTACTO -->
    <footer id="contacto">
        <h2>CYBER STAR</h2>
        <p>Estética urbana y sublimación personalizada.</p>
        <div class="redes">
            <a href="https://www.instagram.com/cyberstar.y2k?igsh=a3hoYjJmd2tlcHcy" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://wa.me/584125129119" target="_blank">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>
        <p class="creditos">© 2026 Cyber Star. Todos los derechos reservados.</p>
    </footer>

    <!-- SIDEBAR DE CARRITO LATERAL -->
    <div id="panel-carrito" class="sidebar-carrito">
        <div class="carrito-header">
            <h3>Tu Pedido</h3>
            <span class="cerrar-carrito" onclick="toggleCarrito()">&times;</span>
        </div>
        
        <div id="items-carrito" class="lista-items-carrito"></div>
        
        <div class="carrito-footer">
            <div class="total-contenedor">
                <span>Total estimado:</span>
                <span id="total-carrito" class="precio">$0.00</span>
            </div>
            <button onclick="enviarCarritoWhatsApp()" class="btn-whatsapp" style="width:100%; border:none; cursor:pointer;">
                <i class="fab fa-whatsapp"></i> Enviar Pedido Completo
            </button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
